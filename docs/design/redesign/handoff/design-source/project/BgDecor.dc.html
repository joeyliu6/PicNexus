<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>背景装饰</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position:absolute;inset:0;overflow:hidden;font-family:Inter,sans-serif;color:inherit">
<div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 {{fade}});mask-image:linear-gradient(180deg,transparent 0,#000 {{fade}})">
<sc-if value="{{bg.bloom}}" hint-placeholder-val="{{ true }}"><div style="position:absolute;inset:0;background:radial-gradient(900px 420px at 50% 4%, rgba(46,166,242,0.10), transparent 70%), radial-gradient(600px 380px at 100% 100%, rgba(77,99,240,0.07), transparent 70%)"></div></sc-if>
<sc-if value="{{bg.aurora}}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;background:linear-gradient(180deg, rgba(8,12,24,0) 0%, rgba(8,12,24,0.35) 100%)"></div>
<div style="position:absolute;left:-12%;top:53%;width:70%;height:46%;border-radius:50%;background:radial-gradient(closest-side, rgba(46,166,242,0.34), rgba(46,166,242,0) 100%);transform:rotate(-14deg);filter:blur(36px)"></div>
<div style="position:absolute;left:30%;top:59%;width:60%;height:40%;border-radius:50%;background:radial-gradient(closest-side, rgba(124,92,246,0.30), rgba(124,92,246,0) 100%);transform:rotate(-8deg);filter:blur(42px)"></div>
<div style="position:absolute;left:62%;top:46%;width:50%;height:34%;border-radius:50%;background:radial-gradient(closest-side, rgba(34,200,190,0.22), rgba(34,200,190,0) 100%);transform:rotate(-20deg);filter:blur(40px)"></div>
<div style="position:absolute;left:10%;top:65%;width:52%;height:10%;border-radius:50%;background:radial-gradient(closest-side, rgba(170,220,255,0.18), rgba(170,220,255,0) 100%);transform:rotate(-12deg);filter:blur(14px)"></div>
</sc-if>
<svg width="100%" height="100%" viewBox="0 0 1192 900" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0"><defs><linearGradient id="bdGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{{c.gradA}}"></stop><stop offset="1" stop-color="{{c.gradB}}"></stop></linearGradient></defs>
<g opacity="{{bg.gA}}"><path d="M64 58L44 29Q40 22 45 16L57 4Q64 -2 71 4L83 16Q88 22 84 29Z" fill="url(#bdGrad)" opacity="{{bg.pa}}" transform="translate(1090 170) rotate(-30 64 64) scale(0.5)"></path><path d="M64 58L44 29Q40 22 45 16L57 4Q64 -2 71 4L83 16Q88 22 84 29Z" fill="url(#bdGrad)" opacity="{{bg.pb}}" transform="translate(930 150) rotate(60 64 64) scale(0.35)"></path><path d="M64 58L44 29Q40 22 45 16L57 4Q64 -2 71 4L83 16Q88 22 84 29Z" fill="url(#bdGrad)" opacity="{{bg.pb}}" transform="translate(170 760) rotate(40 64 64) scale(0.45)"></path><path d="M64 58L44 29Q40 22 45 16L57 4Q64 -2 71 4L83 16Q88 22 84 29Z" fill="url(#bdGrad)" opacity="{{bg.pb}}" transform="translate(20 520) rotate(75 64 64) scale(0.3)"></path><path d="M64 58L44 29Q40 22 45 16L57 4Q64 -2 71 4L83 16Q88 22 84 29Z" fill="url(#bdGrad)" opacity="{{bg.pa}}" transform="translate(1060 690) rotate(-50 64 64) scale(0.55)"></path></g>
<g opacity="{{bg.gAurora}}"><circle cx="731" cy="414" r="0.8" fill="#FFFFFF" opacity="{{bg.stb}}"></circle><circle cx="901" cy="212" r="0.8" fill="#FFFFFF" opacity="{{bg.sta}}"></circle><circle cx="166" cy="302" r="1" fill="#FFFFFF" opacity="{{bg.stb}}"></circle><circle cx="644" cy="345" r="0.8" fill="#FFFFFF" opacity="{{bg.stc}}"></circle><circle cx="281" cy="225" r="1.5" fill="#FFFFFF" opacity="{{bg.sta}}"></circle><circle cx="886" cy="139" r="1.5" fill="#FFFFFF" opacity="{{bg.sta}}"></circle><circle cx="187" cy="509" r="0.8" fill="#FFFFFF" opacity="{{bg.sta}}"></circle><circle cx="899" cy="504" r="1" fill="#FFFFFF" opacity="{{bg.sta}}"></circle><circle cx="361" cy="504" r="1" fill="#FFFFFF" opacity="{{bg.sta}}"></circle><circle cx="1084" cy="393" r="1.5" fill="#FFFFFF" opacity="{{bg.stb}}"></circle><circle cx="64" cy="280" r="1" fill="#FFFFFF" opacity="{{bg.stb}}"></circle><circle cx="112" cy="234" r="0.8" fill="#FFFFFF" opacity="{{bg.stc}}"></circle><circle cx="793" cy="249" r="1.2" fill="#FFFFFF" opacity="{{bg.stb}}"></circle><circle cx="949" cy="307" r="1.2" fill="#FFFFFF" opacity="{{bg.sta}}"></circle><circle cx="574" cy="399" r="0.8" fill="#FFFFFF" opacity="{{bg.stb}}"></circle><circle cx="1122" cy="119" r="1.2" fill="#FFFFFF" opacity="{{bg.stb}}"></circle><circle cx="60" cy="433" r="1.2" fill="#FFFFFF" opacity="{{bg.stb}}"></circle><circle cx="682" cy="114" r="0.8" fill="#FFFFFF" opacity="{{bg.stc}}"></circle><circle cx="241" cy="502" r="1" fill="#FFFFFF" opacity="{{bg.sta}}"></circle><circle cx="879" cy="491" r="1.5" fill="#FFFFFF" opacity="{{bg.stb}}"></circle><circle cx="609" cy="476" r="1.2" fill="#FFFFFF" opacity="{{bg.stb}}"></circle><circle cx="160" cy="417" r="1.2" fill="#FFFFFF" opacity="{{bg.stb}}"></circle></g>
</svg>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"fade":{"editor":"text","default":"48px"},"$preview":{"width":1192,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.theme === 'dark';
    const c = { gradA: dark ? '#46B3F5' : '#2EA6F2', gradB: dark ? '#6B7DF5' : '#4D63F0' };
    const bg = {
      bloom: !dark, aurora: dark, gA: dark ? 0 : 1, gAurora: dark ? 1 : 0,
      pa: 0.10, pb: 0.06, sta: 0.55, stb: 0.35, stc: 0.2, auroraFlower: 0.12
    };
    return { c, bg, fade: this.props.fade ?? '48px' };
  }
}
</script>
</body>
</html>
