<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>拖入感应</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
@keyframes op0{0%,15%{transform:translate(0,0)}45%,75%{transform:translate(0px,-10px)}100%{transform:translate(0,0)} }.op0{animation:op0 2.4s cubic-bezier(.2,0,0,1) infinite}@keyframes op1{0%,15%{transform:translate(0,0)}45%,75%{transform:translate(10px,0px)}100%{transform:translate(0,0)} }.op1{animation:op1 2.4s cubic-bezier(.2,0,0,1) infinite}@keyframes op2{0%,15%{transform:translate(0,0)}45%,75%{transform:translate(0px,10px)}100%{transform:translate(0,0)} }.op2{animation:op2 2.4s cubic-bezier(.2,0,0,1) infinite}@keyframes op3{0%,15%{transform:translate(0,0)}45%,75%{transform:translate(-10px,0px)}100%{transform:translate(0,0)} }.op3{animation:op3 2.4s cubic-bezier(.2,0,0,1) infinite}@keyframes ring{0%,15%{opacity:0;transform:scale(.7)}45%,75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.7)} }.ring{animation:ring 2.4s cubic-bezier(.2,0,0,1) infinite}
@media (prefers-reduced-motion: reduce){.mo,.mo *{animation:none !important} }
</style>
</helmet>
<div class="mo" style="position:relative;width:360px;height:420px;overflow:hidden;background:{{bg}};font-family:Inter,'Microsoft YaHei UI','PingFang SC','Noto Sans SC',sans-serif;color:{{fg}}">
<div style="position:absolute;left:0;right:0;top:0;height:330px;display:flex;align-items:center;justify-content:center">
<div style="position:relative;width:170px;height:170px;display:flex;align-items:center;justify-content:center"><span class="ring" style="position:absolute;inset:0;border-radius:28px;border:2px dashed {{gA}}"></span><svg class="" width="120" height="120" viewBox="-4 -4 136 136" style="overflow:visible" aria-hidden="true"><defs><linearGradient id="mg7" x1="8" y1="8" x2="120" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="{{gA}}"></stop><stop offset="1" stop-color="{{gB}}"></stop></linearGradient></defs><path class="op0" d="M64 58L44 29Q40 22 45 16L57 4Q64 -2 71 4L83 16Q88 22 84 29Z" fill="url(#mg7)" style="transform-origin:64px 64px"></path><path class="op1" d="M70 64L99 44Q106 40 112 45L124 57Q130 64 124 71L112 83Q106 88 99 84Z" fill="url(#mg7)" style="transform-origin:64px 64px"></path><path class="op2" d="M64 70L84 99Q88 106 83 112L71 124Q64 130 57 124L45 112Q40 106 44 99Z" fill="url(#mg7)" style="transform-origin:64px 64px"></path><path class="op3" d="M58 64L29 84Q22 88 16 83L4 71Q-2 64 4 57L16 45Q22 40 29 44Z" fill="url(#mg7)" style="transform-origin:64px 64px"></path></svg></div>
</div>
<div style="position:absolute;left:24px;right:24px;bottom:20px;display:flex;flex-direction:column;gap:4px">
<span style="font-size:15px;line-height:22px;font-weight:600">⑦ 拖入感应</span>
<span style="font-size:12px;line-height:18px;color:{{sub}}">拖着图片进入窗口时，花瓣向四周张开、虚线框亮起，像在「接住」图片；拖出窗口时合拢。</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":360,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    return {
      bg: dark ? 'radial-gradient(240px 200px at 50% 40%, #172133, #0D0F14 70%)' : 'radial-gradient(240px 200px at 50% 40%, #EEF5FE, #FFFFFF 70%)',
      fg: dark ? '#EBEBEC' : '#171717', sub: dark ? '#9C9CA1' : '#6B6B6B',
      gA: dark ? '#46B3F5' : '#2EA6F2', gB: dark ? '#6B7DF5' : '#4D63F0', dim: dark ? '#2A2F3A' : '#E3E7EE', glow: dark ? 'rgba(76,147,245,0.55)' : 'rgba(57,133,237,0.35)'
    };
  }
}
</script>
</body>
</html>
