<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>首页 · 30 张传完 · 部分失败</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:1400px;height:900px">
<dc-import name="HomeScreen" state="batchDone" collapsed="{{ false }}" theme="{{theme}}" platform="{{platform}}" hint-size="1400px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;dark&quot;},&quot;platform&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Windows&quot;,&quot;macOS&quot;,&quot;Linux&quot;],&quot;default&quot;:&quot;Windows&quot;},&quot;$preview&quot;:{&quot;width&quot;:1400,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light', platform: this.props.platform ?? 'Windows' };
  }
}
</script>
</body>
</html>
