<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录授权 - PicNexus</title>
  <style>
    /* Cookie 登录小窗的标题栏（CookieWindow.dc.html，P16）：高 40、侧栏底色、左 14 写「微博登录」12px / 500，右侧关闭键。
       这个页面独立于 Vue 入口，拿不到 tokens.css，下面两块就地重定义同名令牌；
       值与 src/styles/tokens*.css 的一致性由 scripts/check-theme-token-copies.mjs 在 npm run lint 时比对。 */
    :root {
      --pn-sidebar: #151517;
      --pn-text1: #EBEBEC;
    }

    :root.light-theme {
      --pn-sidebar: #F3F3F3;
      --pn-text1: #171717;
    }

    /* Windows 关闭键悬停沿用系统外观（README「平台限制记录」） */
    html {
      --login-close-hover: #C42B1C;
      --login-close-fg: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Inter, 'Microsoft YaHei UI', 'Noto Sans SC', system-ui, sans-serif;
      user-select: none;
    }

    body {
      background: var(--pn-sidebar);
      color: var(--pn-text1);
    }

    .titlebar {
      display: flex;
      align-items: center;
      width: 100%;
      height: 40px;
      padding-left: 14px;
    }

    .service-name {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      align-items: center;
      overflow: hidden;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .close-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 40px;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }

    .close-btn:hover {
      background: var(--login-close-hover);
      color: var(--login-close-fg);
    }

    .close-btn svg {
      width: 12px;
      height: 12px;
    }
  </style>
</head>
<body>
  <div class="titlebar" data-tauri-drag-region>
    <span class="service-name" id="serviceName" data-tauri-drag-region></span>
    <button class="close-btn" id="closeBtn" title="关闭" aria-label="关闭" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
        <path d="M19 5 5 19M5 5l14 14"/>
      </svg>
    </button>
  </div>
  <script type="module" src="/src/login-titlebar.ts"></script>
</body>
</html>
