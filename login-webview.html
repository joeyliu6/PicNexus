<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>登录授权 - PicNexus</title>

  <!-- 首屏主题感知：读 URL ?theme= 参数（useConfig.ts 生成 contentUrl 时始终携带），
       在首次绘制前给 <html> 写 data-theme，避免浅色主题用户先闪一屏深色。Vue 挂载后由 useLoginTheme.ts 接管。 -->
  <script>
    (function () {
      var theme = new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark';
      document.documentElement.dataset.theme = theme;
    })();
  </script>

  <!-- 首屏只铺页面底色：窗口在 Vue 挂载后才显示（show_login_window），这里只防显示前后颜色跳一下。
       本文件独立于 Vue 入口，拿不到 tokens.css，故在此重定义同名令牌；值与 src/styles/tokens*.css 的一致性由
       scripts/check-theme-token-copies.mjs 在 npm run lint 时逐条比对——改这里的值会被门禁拦下，不要只改一边。 -->
  <style>
    :root {
      --pn-canvas: #1C1C1E;
      --pn-text1: #EBEBEC;
    }

    :root[data-theme="light"] {
      --pn-canvas: #FFFFFF;
      --pn-text1: #171717;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--pn-canvas);
      color: var(--pn-text1);
    }

    #app {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/login-webview.ts"></script>
</body>
</html>
