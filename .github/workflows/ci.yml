name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full visual regression run at 02:00 Asia/Shanghai.
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      run_visual:
        description: 'Run Playwright visual regression screenshots'
        required: false
        default: false
        type: boolean
      run_e2e:
        description: 'Run mocked Playwright E2E smoke tests'
        required: false
        default: false
        type: boolean
      run_tauri_e2e:
        description: 'Run real Tauri desktop E2E smoke tests on Windows'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Ubuntu system deps for Tauri
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev build-essential curl wget file

      - name: Install dependencies
        run: npm ci

      - name: Build sidecar binaries for current platform
        run: npm run setup:sidecars

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - name: Cargo check
        run: cargo check
        working-directory: src-tauri

      - name: Cargo test
        run: cargo test
        working-directory: src-tauri

      - name: Type check
        run: npm run typecheck

      - name: Lint (ESLint + Stylelint)
        run: npm run lint

      - name: Build (vite)
        run: npm run build

      # ubuntu 由下面的 test:coverage 跑同一套 suite，这里只补 windows / macOS
      - name: Run unit tests
        if: matrix.os != 'ubuntu-latest'
        run: npm run test:unit

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  obsidian-plugin:
    name: Obsidian plugin
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/obsidian/package-lock.json

      - name: Install plugin dependencies
        run: npm --prefix plugins/obsidian ci

      - name: Validate plugin release
        run: npm run ci:obsidian

      - name: Verify generated plugin bundle is committed
        run: git diff --exit-code -- plugins/obsidian/main.js

  visual-impact:
    name: Detect visual impact
    runs-on: ubuntu-latest

    outputs:
      visual: ${{ steps.filter.outputs.visual || steps.non_pr.outputs.visual || 'false' }}

    steps:
      - name: Detect changed UI and visual files
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            visual:
              - '.github/workflows/ci.yml'
              - 'playwright.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'tests/visual/**'
              - 'src/**/*.vue'
              - 'src/**/*.css'
              - 'src/**/*.scss'
              - 'src/assets/**'
              - 'src/components/**'
              - 'src/composables/**'
              - 'src/config/**'
              - 'src/constants/**'
              - 'src/main.ts'
              - 'src/styles/app.css'
              - 'src/styles/**'
              - 'src/theme/**'
              - 'src/types/**'
              - 'src/core/UploadQueue.ts'
              - 'src/utils/**'

      - name: Mark non-PR events for explicit full visual runs
        id: non_pr
        if: github.event_name != 'pull_request'
        shell: bash
        run: echo "visual=true" >> "$GITHUB_OUTPUT"

  visual:
    name: Visual regression
    needs: visual-impact
    if: >-
      ${{
        (
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.run_visual == 'true') ||
          (github.event_name == 'pull_request' && needs.visual-impact.outputs.visual == 'true')
        )
      }}
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium webkit

      - name: Run visual regression tests
        run: npm run test:visual

      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: E2E smoke
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.run_e2e) }}
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npm run test:e2e:chromium

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  e2e-webkit:
    name: E2E smoke (WebKit)
    # macOS 的 WKWebView 与 Linux 的 WebKitGTK 都是 WebKit，本机 Windows 摸不到。
    # 跑在 ubuntu 是刻意的：Playwright 的 Linux WebKit 构建离 Tauri 的 WebKitGTK 最近。
    # 刚接入，先非阻断观察两周（跑完整应用 + 异步时序，flake 面比布局哨兵大）。
    continue-on-error: true
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.run_e2e) }}
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps webkit

      - name: Run E2E smoke tests on WebKit
        run: npm run test:e2e:webkit

      - name: Upload WebKit E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-webkit-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  tauri-e2e:
    name: Tauri desktop E2E smoke
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_tauri_e2e == 'true'
    runs-on: windows-latest
    # ⚠️ 2026-08-21 起暂设为非阻断：windows-2025 镜像 2026-08-18 更新（WebView2 149→151）后，
    # msedgedriver 拉起应用时 DevToolsActivePort 永远不落盘，会话必然建不起来。
    # 四轮诊断已排除：驱动/运行时版本不匹配（.86/.93/.101 全试过）、Edge 策略、提权降权、
    # tauri-driver（裸 msedgedriver 同样复现）。应用本身在跑手上裸启动健康；本机同套件 4/4 过。
    # 恢复条件与证据链见 docs/TODO.md「Tauri E2E 在 CI 跑手上建会话失败」。
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build sidecar binaries for Windows
        run: npm run setup:sidecars

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: tauri-e2e-windows

      - name: Install Tauri desktop E2E drivers
        shell: pwsh
        run: |
          cargo install tauri-driver --locked
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"

          $cargoBin = Join-Path $HOME ".cargo/bin"
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $PWD.Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run Tauri desktop E2E smoke tests
        id: tauri_e2e
        run: npm run test:tauri:e2e

      # 非阻断 ≠ 静默：失败时把结论写进本次运行的 Summary 并打一条 warning 注解，
      # 避免应用侧真回归被 continue-on-error 悄悄放过（只留在 step 日志里没人看）。
      - name: Report Tauri desktop E2E outcome
        if: always() && steps.tauri_e2e.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=Tauri desktop E2E failed (non-gating)::日志含 DevToolsActivePort 属已知跑手环境问题；否则按应用侧回归处理。"
          {
            echo "## ⚠️ Tauri desktop E2E 失败（非阻断）"
            echo ""
            echo "该 job 自 2026-08-21 起 \`continue-on-error: true\`，失败不会挂掉工作流。"
            echo "本条 Summary 是它唯一的失败出口，请人工判定属于哪一类："
            echo ""
            echo "| 日志特征 | 判定 | 处理 |"
            echo "| --- | --- | --- |"
            echo "| 出现 \`DevToolsActivePort\` / 会话建不起来 | 已知跑手环境问题（WebView2 151） | 可忽略 |"
            echo "| 用例内断言失败、超时 | 疑似应用侧回归 | 必须人工确认 |"
            echo ""
            echo "恢复条件与四轮诊断证据链见 \`docs/TODO.md\`「Tauri E2E 在 CI 跑手上建会话失败」。"
          } >> "$GITHUB_STEP_SUMMARY"
