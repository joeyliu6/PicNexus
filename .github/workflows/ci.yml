name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full visual regression run at 02:00 Asia/Shanghai.
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      run_visual:
        description: 'Run Playwright visual regression screenshots'
        required: false
        default: false
        type: boolean
      run_e2e:
        description: 'Run mocked Playwright E2E smoke tests'
        required: false
        default: false
        type: boolean
      run_tauri_e2e:
        description: 'Run real Tauri desktop E2E smoke tests on Windows'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Ubuntu system deps for Tauri
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev build-essential curl wget file

      - name: Install dependencies
        run: npm ci

      - name: Build sidecar binaries for current platform
        run: npm run setup:sidecars

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - name: Cargo check
        run: cargo check
        working-directory: src-tauri

      - name: Cargo test
        run: cargo test
        working-directory: src-tauri

      - name: Type check
        run: npm run typecheck

      - name: Lint (ESLint + Stylelint)
        run: npm run lint

      - name: Build (vite)
        run: npm run build

      # ubuntu 由下面的 test:coverage 跑同一套 suite，这里只补 windows / macOS
      - name: Run unit tests
        if: matrix.os != 'ubuntu-latest'
        run: npm run test:unit

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  obsidian-plugin:
    name: Obsidian plugin
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/obsidian/package-lock.json

      - name: Install plugin dependencies
        run: npm --prefix plugins/obsidian ci

      - name: Validate plugin release
        run: npm run ci:obsidian

      - name: Verify generated plugin bundle is committed
        run: git diff --exit-code -- plugins/obsidian/main.js

  visual-impact:
    name: Detect visual impact
    runs-on: ubuntu-latest

    outputs:
      visual: ${{ steps.filter.outputs.visual || steps.non_pr.outputs.visual || 'false' }}

    steps:
      - name: Detect changed UI and visual files
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            visual:
              - '.github/workflows/ci.yml'
              - 'playwright.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'tests/visual/**'
              - 'src/**/*.vue'
              - 'src/**/*.css'
              - 'src/**/*.scss'
              - 'src/assets/**'
              - 'src/components/**'
              - 'src/composables/**'
              - 'src/config/**'
              - 'src/constants/**'
              - 'src/main.ts'
              - 'src/styles/app.css'
              - 'src/styles/**'
              - 'src/theme/**'
              - 'src/types/**'
              - 'src/core/UploadQueue.ts'
              - 'src/utils/**'

      - name: Mark non-PR events for explicit full visual runs
        id: non_pr
        if: github.event_name != 'pull_request'
        shell: bash
        run: echo "visual=true" >> "$GITHUB_OUTPUT"

  visual:
    name: Visual regression
    needs: visual-impact
    if: >-
      ${{
        (
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.run_visual == 'true') ||
          (github.event_name == 'pull_request' && needs.visual-impact.outputs.visual == 'true')
        )
      }}
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium webkit

      - name: Run visual regression tests
        run: npm run test:visual

      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: E2E smoke
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.run_e2e) }}
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npm run test:e2e:chromium

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  e2e-webkit:
    name: E2E smoke (WebKit)
    # macOS 的 WKWebView 与 Linux 的 WebKitGTK 都是 WebKit，本机 Windows 摸不到。
    # 跑在 ubuntu 是刻意的：Playwright 的 Linux WebKit 构建离 Tauri 的 WebKitGTK 最近。
    # 刚接入，先非阻断观察两周（跑完整应用 + 异步时序，flake 面比布局哨兵大）。
    continue-on-error: true
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.run_e2e) }}
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps webkit

      - name: Run E2E smoke tests on WebKit
        run: npm run test:e2e:webkit

      - name: Upload WebKit E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-webkit-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  tauri-e2e:
    name: Tauri desktop E2E smoke
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_tauri_e2e == 'true'
    runs-on: windows-latest
    # ⚠️ 2026-08-21 起暂设为非阻断，2026-09-09 已定位根因并接入 workaround，待一次
    # dispatch 复验转绿后即可摘掉本行与下方的降权说明，并把 if: 放开到 push / PR。
    #
    # 根因（微软确认 by-design，**不会有上游修复**，等镜像更新是白等）：
    #   WebView2 Runtime 150+ 在宿主进程提权（High Integrity）时，故意忽略
    #   WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS 环境变量；而 msedgedriver 恰恰只能通过
    #   这个变量注入 --remote-debugging-port，于是调试端口不开、DevToolsActivePort
    #   永不落盘、会话 60 秒超时。GitHub 托管跑手默认以管理员运行，故必现。
    #   https://github.com/tauri-apps/wry/issues/1782
    #   https://github.com/MicrosoftEdge/WebView2Feedback/issues/5645
    #
    # 注：2026-08-21 那轮诊断把「提权降权」记成了已排除，是**错误结论**——当时用
    # runas /trustlevel 且没给 workspace 重新授权，应用起不来被误判成"降权也没用"。
    # 详见 docs/audits/tauri-e2e-runner-webview2-2026-08-21.md 的 2026-09-09 追记。
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build sidecar binaries for Windows
        run: npm run setup:sidecars

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: tauri-e2e-windows

      - name: Install Tauri desktop E2E drivers
        shell: pwsh
        run: |
          cargo install tauri-driver --locked
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"

          $cargoBin = Join-Path $HOME ".cargo/bin"
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $PWD.Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 取证步骤：坐实跑手确实以 High Integrity 运行（wry#1782 的前提）。
      # 上游结论再硬也不能替代在自己环境里实测一次——2026-08-21 那行错误的
      # 「已排除提权」正是"没实测就下定论"的产物，不再犯第二次。
      - name: Probe process integrity level
        shell: pwsh
        run: |
          whoami /groups | Select-String "Mandatory Label"

      - name: Run Tauri desktop E2E smoke tests
        id: tauri_e2e
        shell: pwsh
        run: |
          # 把整条链（node → wdio → tauri-driver → msedgedriver → picnexus.exe）降到
          # Medium 完整性级别运行。被检查完整性级别的是 WebView2 宿主进程，而它是
          # msedgedriver 的子进程、令牌自上而下继承，所以降权必须作用在链条顶端。
          # 依据：https://github.com/tauri-apps/wry/issues/1782 (2026-09-07 评论)
          # 这里用 choco 而非上游示例的 winget——choco 在 GitHub Windows 跑手上预装，
          # winget 在非交互会话里历史上有过问题。
          choco install gsudo -y --no-progress
          # ⚠️ icacls 这行不能省：降到 Medium 后进程会失去 workspace 读写权限，
          #    应用起不来会被误判成"降权也没用"。2026-08-21 那轮很可能就栽在这里。
          icacls "$env:GITHUB_WORKSPACE" /grant "Everyone:(OI)(CI)F" | Out-Null
          gsudo --integrity Medium npm run test:tauri:e2e

      # 非阻断 ≠ 静默：失败时把结论写进本次运行的 Summary 并打一条 warning 注解，
      # 避免应用侧真回归被 continue-on-error 悄悄放过（只留在 step 日志里没人看）。
      - name: Report Tauri desktop E2E outcome
        if: always() && steps.tauri_e2e.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=Tauri desktop E2E failed (non-gating)::降权 workaround 已接入；再出现 DevToolsActivePort 说明绕法没生效，不能再当'已知问题'忽略。"
          {
            echo "## ⚠️ Tauri desktop E2E 失败（非阻断）"
            echo ""
            echo "该 job 自 2026-08-21 起 \`continue-on-error: true\`，失败不会挂掉工作流。"
            echo "2026-09-09 起已接入 gsudo 降权 workaround，判据随之改变："
            echo ""
            echo "| 日志特征 | 判定 | 处理 |"
            echo "| --- | --- | --- |"
            echo "| \`Mandatory Label\` 探针显示 High + 出现 \`DevToolsActivePort\` | 降权没生效（gsudo 装失败 / icacls 没授权成功） | 查上面两步的日志 |"
            echo "| 探针显示 Medium 但仍 \`DevToolsActivePort\` | 降权生效了仍失败 → 本方案被证伪 | 回落 Linux + WebKitWebDriver 方案 |"
            echo "| 用例内断言失败、超时 | 疑似应用侧回归 | 必须人工确认 |"
            echo ""
            echo "根因与处置见 \`docs/TODO.md\`「Tauri E2E 在 CI 跑手上建会话失败」，"
            echo "上游依据 https://github.com/tauri-apps/wry/issues/1782 。"
          } >> "$GITHUB_STEP_SUMMARY"
