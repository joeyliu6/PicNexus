name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full visual regression run at 02:00 Asia/Shanghai.
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      run_visual:
        description: 'Run Playwright visual regression screenshots'
        required: false
        default: false
        type: boolean
      run_e2e:
        description: 'Run mocked Playwright E2E smoke tests'
        required: false
        default: false
        type: boolean
      run_tauri_e2e:
        description: 'Run real Tauri desktop E2E smoke tests on Windows'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Ubuntu system deps for Tauri
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev build-essential curl wget file

      - name: Install dependencies
        run: npm ci

      - name: Build sidecar binaries for current platform
        run: npm run setup:sidecars

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - name: Cargo check
        run: cargo check
        working-directory: src-tauri

      - name: Cargo test
        run: cargo test
        working-directory: src-tauri

      - name: Type check
        run: npm run typecheck

      - name: Lint (ESLint + Stylelint)
        run: npm run lint

      - name: Build (vite)
        run: npm run build

      # ubuntu 由下面的 test:coverage 跑同一套 suite，这里只补 windows / macOS
      - name: Run unit tests
        if: matrix.os != 'ubuntu-latest'
        run: npm run test:unit

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  obsidian-plugin:
    name: Obsidian plugin
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/obsidian/package-lock.json

      - name: Install plugin dependencies
        run: npm --prefix plugins/obsidian ci

      - name: Validate plugin release
        run: npm run ci:obsidian

      - name: Verify generated plugin bundle is committed
        run: git diff --exit-code -- plugins/obsidian/main.js

  visual-impact:
    name: Detect visual impact
    runs-on: ubuntu-latest

    outputs:
      visual: ${{ steps.filter.outputs.visual || steps.non_pr.outputs.visual || 'false' }}

    steps:
      - name: Detect changed UI and visual files
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            visual:
              - '.github/workflows/ci.yml'
              - 'playwright.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'tests/visual/**'
              - 'src/**/*.vue'
              - 'src/**/*.css'
              - 'src/**/*.scss'
              - 'src/assets/**'
              - 'src/components/**'
              - 'src/composables/**'
              - 'src/config/**'
              - 'src/constants/**'
              - 'src/main.ts'
              - 'src/styles/app.css'
              - 'src/styles/**'
              - 'src/theme/**'
              - 'src/types/**'
              - 'src/core/UploadQueue.ts'
              - 'src/utils/**'

      - name: Mark non-PR events for explicit full visual runs
        id: non_pr
        if: github.event_name != 'pull_request'
        shell: bash
        run: echo "visual=true" >> "$GITHUB_OUTPUT"

  visual:
    name: Visual regression
    needs: visual-impact
    if: >-
      ${{
        (
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.run_visual == 'true') ||
          (github.event_name == 'pull_request' && needs.visual-impact.outputs.visual == 'true')
        )
      }}
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium webkit

      - name: Run visual regression tests
        run: npm run test:visual

      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: E2E smoke
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.run_e2e) }}
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npm run test:e2e:chromium

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  e2e-webkit:
    name: E2E smoke (WebKit)
    # macOS 的 WKWebView 与 Linux 的 WebKitGTK 都是 WebKit，本机 Windows 摸不到。
    # 跑在 ubuntu 是刻意的：Playwright 的 Linux WebKit 构建离 Tauri 的 WebKitGTK 最近。
    # 刚接入，先非阻断观察两周（跑完整应用 + 异步时序，flake 面比布局哨兵大）。
    continue-on-error: true
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.run_e2e) }}
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps webkit

      - name: Run E2E smoke tests on WebKit
        run: npm run test:e2e:webkit

      - name: Upload WebKit E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-webkit-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  tauri-e2e:
    name: Tauri desktop E2E smoke
    # 2026-09-10 起阻断。触发面是 push + 勾选的 dispatch，**刻意不含 PR**：
    # testing-guide 的既有结论是「成本高，不建议直接放入每个 PR」，这里不推翻它；
    # 而本仓库最近 20 次 CI 触发里 PR 数为 0，只挂 PR 等于不跑。
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_tauri_e2e) }}
    needs: test
    runs-on: windows-latest
    #
    # 根因（微软确认 by-design，**不会有上游修复**，等镜像更新是白等）：
    #   WebView2 Runtime 150+ 在宿主进程提权（High Integrity）时，故意忽略
    #   WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS 环境变量；而 msedgedriver 恰恰只能通过
    #   这个变量注入 --remote-debugging-port，于是调试端口不开、DevToolsActivePort
    #   永不落盘、会话 60 秒超时。GitHub 托管跑手默认以管理员运行，故必现。
    #   https://github.com/tauri-apps/wry/issues/1782
    #   https://github.com/MicrosoftEdge/WebView2Feedback/issues/5645
    #
    # 注：2026-08-21 那轮诊断把「提权降权」记成了已排除，是**错误结论**——当时用
    # runas /trustlevel 且没给 workspace 重新授权，应用起不来被误判成"降权也没用"。
    # 详见 docs/audits/tauri-e2e-runner-webview2-2026-08-21.md 的 2026-09-09 追记。
    #
    # 2026-09-10 复验通过后摘掉 continue-on-error：run 34428364202 的探针显示
    # High Mandatory Level（根因坐实），降权后 4 passing / 2 spec files，
    # WebView2 151.0.4129.101 上再无 DevToolsActivePort。

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build sidecar binaries for Windows
        run: npm run setup:sidecars

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: tauri-e2e-windows

      - name: Install Tauri desktop E2E drivers
        shell: pwsh
        run: |
          cargo install tauri-driver --locked
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"

          $cargoBin = Join-Path $HOME ".cargo/bin"
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $PWD.Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 取证步骤：坐实跑手确实以 High Integrity 运行（wry#1782 的前提）。
      # 上游结论再硬也不能替代在自己环境里实测一次——2026-08-21 那行错误的
      # 「已排除提权」正是"没实测就下定论"的产物，不再犯第二次。
      - name: Probe process integrity level
        shell: pwsh
        run: |
          whoami /groups | Select-String "Mandatory Label"

      - name: Run Tauri desktop E2E smoke tests
        id: tauri_e2e
        shell: pwsh
        run: |
          # 把整条链（node → wdio → tauri-driver → msedgedriver → picnexus.exe）降到
          # Medium 完整性级别运行。被检查完整性级别的是 WebView2 宿主进程，而它是
          # msedgedriver 的子进程、令牌自上而下继承，所以降权必须作用在链条顶端。
          # 依据：https://github.com/tauri-apps/wry/issues/1782 (2026-09-07 评论)
          # 这里用 choco 而非上游示例的 winget——choco 在 GitHub Windows 跑手上预装，
          # winget 在非交互会话里历史上有过问题。
          choco install gsudo -y --no-progress
          # ⚠️ icacls 这行不能省：降到 Medium 后进程会失去 workspace 读写权限，
          #    应用起不来会被误判成"降权也没用"。2026-08-21 那轮很可能就栽在这里。
          icacls "$env:GITHUB_WORKSPACE" /grant "Everyone:(OI)(CI)F" | Out-Null

          # ⚠️ 自检：本步骤的成败**完全押在 gsudo 转达子进程成败上**——GitHub 的 pwsh
          # 步骤拿最后一条命令的 $LASTEXITCODE 当结果。转达一旦坏掉，这个已阻断的门禁
          # 就变成「测试挂了也放行」的假门禁，比没有门禁更危险。
          # 不能想当然：choco 当前发的是 gsudo v2.6.1（2025-10），而上游两个
          # 「退出码丢失」修复（gerardog/gsudo#410、#421）2026-05 才合入、尚未随任何
          # release 发布。所以每次都实测一遍，坏了当场喊。
          #
          # ⚠️ 断言的是「0 保持 0、非零保持非零」这两条**门禁真正依赖的性质**，
          # 不是「退出码数值原样透传」。2026-09-10 run 34429720917 实测：v2.6.1 会把
          # 非零退出码**归一成 1**（子进程 exit 42 → gsudo 返回 1），与上述两个未发布
          # 修复的描述一致。数值丢了不影响门禁——只要失败仍是非零就够。当初把断言写成
          # `-ne 42` 卡的是门禁并不关心的性质，白红了一次。
          gsudo --integrity Medium cmd /c "exit 0"
          if ($LASTEXITCODE -ne 0) {
            throw "gsudo 把成功报成了失败（$LASTEXITCODE）——门禁会永远红，先修 gsudo 调用。"
          }

          gsudo --integrity Medium cmd /c "exit 42"
          if ($LASTEXITCODE -eq 0) {
            throw "gsudo 把子进程的失败吞成了成功——本门禁不可信（会假绿），先修这个再看 E2E 结果。"
          }

          gsudo --integrity Medium npm run test:tauri:e2e

      # 该 job 2026-09-10 起阻断，失败会挂掉工作流。这一步不再是"唯一的失败出口"，
      # 但仍保留：它把"该按哪一类处理"直接写进 Summary，省掉每次翻 step 日志。
      - name: Report Tauri desktop E2E outcome
        if: always() && steps.tauri_e2e.outcome == 'failure'
        shell: bash
        run: |
          echo "::error title=Tauri desktop E2E failed::按 Summary 的判据分类；2026-09-10 起该 job 阻断，DevToolsActivePort 不再是可忽略的已知问题。"
          {
            echo "## ❌ Tauri desktop E2E 失败"
            echo ""
            echo "该 job 2026-09-10 起阻断（此前 \`continue-on-error\` 已摘）。按日志特征分类："
            echo ""
            echo "| 日志特征 | 判定 | 处理 |"
            echo "| --- | --- | --- |"
            echo "| \`gsudo 未透传子进程退出码\` | 自检拦下，门禁本身不可信 | 先修 gsudo 调用，别看 E2E 结果 |"
            echo "| 探针 High + 出现 \`DevToolsActivePort\` | 降权没生效（gsudo 装失败 / icacls 没授权成功） | 查上面两步的日志 |"
            echo "| 探针 Medium 但仍 \`DevToolsActivePort\` | 降权方案被证伪 | 回落 Linux + WebKitWebDriver 方案 |"
            echo "| 用例内断言失败、超时 | 应用侧回归 | 按普通失败修 |"
            echo ""
            echo "根因与处置见 \`docs/TODO.md\`「Tauri E2E 在 CI 跑手上建会话失败」，"
            echo "上游依据 https://github.com/tauri-apps/wry/issues/1782 。"
          } >> "$GITHUB_STEP_SUMMARY"
