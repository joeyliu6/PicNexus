name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  web-smoke:
    name: Web smoke E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run web smoke E2E before release
        run: npm run test:e2e:chromium

      - name: Upload web smoke E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-release-smoke-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: web-smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: ''
          - platform: macos-latest
            target: 'aarch64-apple-darwin'
          - platform: macos-latest
            target: 'x86_64-apple-darwin'
          - platform: ubuntu-latest
            target: ''
    runs-on: ${{ matrix.platform }}

    steps:
      # git-cliff 需要完整 git 历史。浅克隆下它只能看到 HEAD 那一个提交，
      # 生成的 changelog 会静默残缺：v1.1.0 只捞到一条、v1.1.1 直接为空——
      # HEAD 恰好是被 commit_parsers 过滤掉的类型时就什么都不剩。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Ubuntu system deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev build-essential curl wget file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build sidecar binaries for current target
        run: npm run setup:sidecars ${{ matrix.target && format('-- --target {0}', matrix.target) || '' }}

      # build 不再内联 tsc，发版路径的类型闸门改由这一步承担（vue-tsc 覆盖 .ts 与 .vue）
      - name: Type check before release
        run: npm run typecheck

      - name: Lint before release
        run: npm run lint

      - name: Run unit tests before release
        run: npm run test:unit

      - name: Install Tauri desktop E2E drivers (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          cargo install tauri-driver --locked
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"

          $cargoBin = Join-Path $HOME ".cargo/bin"
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $PWD.Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # ⚠️ 2026-08-21 起暂设为非阻断，2026-09-09 已定位根因并接入降权 workaround。
      # WebView2 Runtime 150+ 在提权宿主下故意丢弃 msedgedriver 注入的
      # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS（含 --remote-debugging-port），
      # 于是 DevToolsActivePort 永不落盘。微软确认 by-design，不会有上游修复。
      #   https://github.com/tauri-apps/wry/issues/1782
      #   https://github.com/MicrosoftEdge/WebView2Feedback/issues/5645
      # ci.yml 的同名 job 复验转绿后，这里的 continue-on-error 一并摘掉。
      # 在此之前应用可运行性仍由下方安装包冒烟（App running OK）+ 本地
      # npm run test:tauri:e2e 兜底。
      - name: Run Tauri desktop E2E before release (Windows)
        id: tauri_e2e
        if: matrix.platform == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        run: |
          # 降权到 Medium 完整性级别，必须作用在整条链的顶端（跑 wdio 的 node 进程）。
          # icacls 那行不能省：降权后进程会失去 workspace 读写权限，应用起不来。
          whoami /groups | Select-String "Mandatory Label"
          choco install gsudo -y --no-progress
          icacls "$env:GITHUB_WORKSPACE" /grant "Everyone:(OI)(CI)F" | Out-Null
          gsudo --integrity Medium npm run test:tauri:e2e

      # 非阻断 ≠ 静默：失败时留一条 warning 注解 + Summary 段落，
      # 否则发版路径上的应用侧回归只会躺在 step 日志里，没人会翻。
      - name: Report Tauri desktop E2E outcome
        if: always() && steps.tauri_e2e.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=Tauri desktop E2E failed (non-gating)::发版继续，但降权 workaround 已接入，再出现 DevToolsActivePort 不能再当'已知问题'忽略。"
          {
            echo "## ⚠️ Tauri desktop E2E 失败（非阻断，发版已继续）"
            echo ""
            echo "| 日志特征 | 判定 | 处理 |"
            echo "| --- | --- | --- |"
            echo "| \`Mandatory Label\` 显示 High + \`DevToolsActivePort\` | 降权没生效（gsudo / icacls 那两步失败） | 查该步日志 |"
            echo "| 显示 Medium 但仍 \`DevToolsActivePort\` | 降权方案被证伪 | 发版前人工确认，另议 Linux 方案 |"
            echo "| 用例内断言失败、超时 | 疑似应用侧回归 | 发版前必须人工确认 |"
            echo ""
            echo "兜底覆盖：下方安装包冒烟（App running OK）+ 本地 \`npm run test:tauri:e2e\`。"
            echo "根因见 \`docs/TODO.md\`「Tauri E2E 在 CI 跑手上建会话失败」与 wry#1782。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header

      # 这里只产出 git-cliff 的提交清单作为初稿。发布前 body 要人工重写成面向用户的
      # 中文条目（一行一条、动词开头、相关修复合并成一句，参照 v1.1.0 与 v1.1.1 的写法），
      # 所以不再拼装「推荐下载」表——它每次都得手工删掉，是纯负担。
      - name: Prepare release body
        id: release_body
        shell: bash
        env:
          CHANGELOG: ${{ steps.changelog.outputs.content }}
        run: |
          {
            echo 'content<<PICNEXUS_RELEASE_BODY'
            printf '%s\n' "$CHANGELOG"
            echo 'PICNEXUS_RELEASE_BODY'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # GA4 在线心跳密钥：编译期注入，缺失时心跳自动禁用（不影响构建）
          PICNEXUS_GA_API_SECRET: ${{ secrets.PICNEXUS_GA_API_SECRET }}
        with:
          tagName: v__VERSION__
          releaseName: 'PicNexus v__VERSION__'
          releaseBody: ${{ steps.release_body.outputs.content }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Package Windows portable ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: npm run package:portable:win

      - name: Smoke test portable ZIP (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path "src-tauri/target/release/portable" -Filter "*_portable.zip" | Select-Object -First 1
          if (-not $zip) { throw "Portable ZIP not found" }

          $extractRoot = Join-Path $env:RUNNER_TEMP "picnexus-portable-smoke"
          if (Test-Path -LiteralPath $extractRoot) {
            $resolvedTemp = (Resolve-Path -LiteralPath $env:RUNNER_TEMP).Path
            $resolvedExtractRoot = (Resolve-Path -LiteralPath $extractRoot).Path
            if (-not $resolvedExtractRoot.StartsWith($resolvedTemp, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Refusing to remove path outside RUNNER_TEMP: $resolvedExtractRoot"
            }
            Remove-Item -LiteralPath $resolvedExtractRoot -Recurse -Force
          }

          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extractRoot -Force

          $portableDir = Join-Path $extractRoot "PicNexus"
          $required = @(
            "PicNexus.exe",
            "bin/qiyu-token-fetcher.exe",
            "bin/nami-token-fetcher.exe",
            "icons/icon.png",
            "data/portable.json"
          )
          foreach ($item in $required) {
            $path = Join-Path $portableDir $item
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Portable ZIP missing required file: $item"
            }
          }

          & (Join-Path $portableDir "PicNexus.exe") --version

      - name: Upload Windows portable ZIP to draft release
        if: matrix.platform == 'windows-latest'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = context.ref.replace('refs/tags/', '');
            const portableDir = 'src-tauri/target/release/portable';
            const portableAssets = fs.readdirSync(portableDir)
              .filter(name => name.endsWith('_portable.zip') || name.endsWith('_portable.zip.sha256'))
              .sort((a, b) => Number(a.endsWith('.sha256')) - Number(b.endsWith('.sha256')));
            const assetName = portableAssets.find(name => name.endsWith('_portable.zip'));

            if (!assetName) {
              throw new Error(`No portable ZIP found in ${portableDir}`);
            }

            const { data: releases } = await github.rest.repos.listReleases({
              owner,
              repo,
              per_page: 100,
            });

            let release = releases.find(r => r.tag_name === tag);
            if (!release) {
              release = releases.find(r => r.draft && r.tag_name.startsWith('untagged-'));
              if (release) {
                await github.rest.repos.updateRelease({
                  owner,
                  repo,
                  release_id: release.id,
                  tag_name: tag,
                });
              }
            }

            if (!release) {
              throw new Error(`No draft release found for tag ${tag}`);
            }

            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner,
              repo,
              release_id: release.id,
              per_page: 100,
            });
            for (const portableAssetName of portableAssets) {
              const existing = assets.find(asset => asset.name === portableAssetName);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: existing.id,
                });
              }

              const assetPath = path.join(portableDir, portableAssetName);
              const data = fs.readFileSync(assetPath);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name: portableAssetName,
                data,
                headers: {
                  'content-type': portableAssetName.endsWith('.sha256') ? 'text/plain' : 'application/zip',
                  'content-length': data.length,
                },
              });

              console.log(`Uploaded portable asset: ${portableAssetName}`);
            }

      # Tier 3 B: 安装包冒烟 — 静默装 MSI + 启动 15 秒探活，macOS 跳过
      - name: Smoke test installer (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
          if (-not $msi) { throw "MSI not found" }
          Write-Host "Installing: $($msi.FullName)"
          Start-Process msiexec.exe -ArgumentList "/i", "`"$($msi.FullName)`"", "/quiet", "/norestart" -Wait

          $exe = "C:\Program Files\PicNexus\PicNexus.exe"
          if (-not (Test-Path $exe)) { throw "Binary not found after install: $exe" }

          Write-Host "Launching app..."
          $proc = Start-Process $exe -PassThru
          Start-Sleep -Seconds 15

          if ($proc.HasExited) {
            throw "App exited prematurely with code $($proc.ExitCode)"
          }

          Write-Host "App running OK, killing..."
          Stop-Process -Id $proc.Id -Force

      - name: Smoke test AppImage (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          if [ -z "$APPIMAGE" ]; then echo "AppImage not found"; exit 1; fi
          chmod +x "$APPIMAGE"

          sudo apt-get install -y xvfb
          xvfb-run --auto-servernum "$APPIMAGE" &
          APP_PID=$!
          sleep 15

          if ! kill -0 $APP_PID 2>/dev/null; then
            echo "App exited prematurely"
            exit 1
          fi

          echo "App running OK, killing..."
          kill $APP_PID

  obsidian-plugin:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/release-obsidian-plugin.yml
    with:
      desktop_tag: ${{ github.ref_name }}
      target_repo: ${{ vars.OBSIDIAN_PLUGIN_REPOSITORY || 'joeyliu6/picnexus-obsidian' }}
    secrets:
      release_token: ${{ secrets.OBSIDIAN_PLUGIN_RELEASE_TOKEN }}

  # Tier 3 D: desktop and plugin assets are ready before final checksums and checklist
  release-checklist:
    needs: [release, obsidian-plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ⚠️ 必须跑在 SHA256SUMS 之前：这一步会改写 latest.json，之后才能算出正确的校验和。
      #
      # 为什么需要它：tauri-action 把通用键 windows-x86_64 填成了 MSI（65.7MB，走 Windows
      # Installer 事务，实测安装 79s），而 NSIS setup.exe 只有 42.7MB 且是自解压。客户端本该
      # 先查 windows-x86_64-{installer}，但那依赖二进制里的 __TAURI_BUNDLE_TYPE 打包戳——实测
      # 产物里它仍是未替换的 __TAURI_BUNDLE_TYPE_VAR_UNK，bundle_type() 返回 None，于是所有
      # Windows 用户都落到通用键上拿 MSI。MSI 继续作为手动下载资产保留，只是不再参与自动更新。
      - name: Point Windows updater at the NSIS installer
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = context.ref.replace('refs/tags/', '');
            const manifestName = 'latest.json';

            const { data: releases } = await github.rest.repos.listReleases({
              owner,
              repo,
              per_page: 100,
            });

            let release = releases.find(r => r.tag_name === tag);
            if (!release) {
              release = releases.find(r => r.draft && r.tag_name.startsWith('untagged-'));
              if (release) {
                await github.rest.repos.updateRelease({
                  owner,
                  repo,
                  release_id: release.id,
                  tag_name: tag,
                });
              }
            }

            if (!release) {
              throw new Error(`No draft release found for tag ${tag}`);
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: release.id,
              per_page: 100,
            });
            const manifestAsset = assets.find(asset => asset.name === manifestName);
            if (!manifestAsset) {
              throw new Error(`${manifestName} not found in release ${release.tag_name}`);
            }

            const response = await github.request('GET /repos/{owner}/{repo}/releases/assets/{asset_id}', {
              owner,
              repo,
              asset_id: manifestAsset.id,
              headers: { accept: 'application/octet-stream' },
            });
            const raw = Buffer.isBuffer(response.data)
              ? response.data
              : Buffer.from(response.data instanceof ArrayBuffer ? new Uint8Array(response.data) : response.data);
            const manifest = JSON.parse(raw.toString('utf8'));

            // 改写逻辑住在 scripts/rewrite-updater-manifest.mjs，与
            // scripts/test/updater-manifest-rewrite.test.mjs 共用同一份实现——
            // 内联在这里的话，测试测的就是另一份拷贝，两者会悄悄漂移。
            // 校验不过会抛错：静默降级比报错更糟，真跌回 MSI 时没人会发现，
            // 只会再收到一次"更新好慢"的反馈。
            const { pathToFileURL } = require('node:url');
            const { join } = require('node:path');
            const rewriteModulePath = join(process.env.GITHUB_WORKSPACE, 'scripts', 'rewrite-updater-manifest.mjs');
            const { rewriteUpdaterManifest } = await import(pathToFileURL(rewriteModulePath).href);

            const { manifest: rewritten, previousUrl, nextUrl } = rewriteUpdaterManifest(manifest);

            await github.rest.repos.deleteReleaseAsset({
              owner,
              repo,
              asset_id: manifestAsset.id,
            });

            // rewriteUpdaterManifest 不修改入参，这里必须上传 rewritten 而不是 manifest
            const data = Buffer.from(`${JSON.stringify(rewritten, null, 2)}\n`, 'utf8');
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.id,
              name: manifestName,
              data,
              headers: {
                'content-type': 'application/json',
                'content-length': data.length,
              },
            });

            console.log(`windows-x86_64: ${previousUrl ?? '(none)'} -> ${nextUrl}`);

      - name: Generate SHA256SUMS for draft release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const crypto = require('crypto');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = context.ref.replace('refs/tags/', '');
            const checksumAssetName = 'SHA256SUMS.txt';
            const checksumTargetPattern = /\.(msi|exe|dmg|appimage|deb|rpm|zip|json)$/i;

            const { data: releases } = await github.rest.repos.listReleases({
              owner,
              repo,
              per_page: 100,
            });

            let release = releases.find(r => r.tag_name === tag);
            if (!release) {
              release = releases.find(r => r.draft && r.tag_name.startsWith('untagged-'));
              if (release) {
                await github.rest.repos.updateRelease({
                  owner,
                  repo,
                  release_id: release.id,
                  tag_name: tag,
                });
              }
            }

            if (!release) {
              throw new Error(`No draft release found for tag ${tag}`);
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: release.id,
              per_page: 100,
            });
            const checksumTargets = assets
              .filter(asset => asset.name !== checksumAssetName)
              .filter(asset => !asset.name.endsWith('.sha256'))
              .filter(asset => checksumTargetPattern.test(asset.name))
              .sort((a, b) => a.name.localeCompare(b.name));

            if (checksumTargets.length === 0) {
              throw new Error('No release assets found for SHA256SUMS.txt');
            }

            const lines = [];
            for (const asset of checksumTargets) {
              const response = await github.request('GET /repos/{owner}/{repo}/releases/assets/{asset_id}', {
                owner,
                repo,
                asset_id: asset.id,
                headers: { accept: 'application/octet-stream' },
              });
              const buffer = Buffer.isBuffer(response.data)
                ? response.data
                : Buffer.from(response.data instanceof ArrayBuffer ? new Uint8Array(response.data) : response.data);
              const hash = crypto.createHash('sha256').update(buffer).digest('hex');
              lines.push(`${hash}  ${asset.name}`);
            }

            const existingChecksum = assets.find(asset => asset.name === checksumAssetName);
            if (existingChecksum) {
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: existingChecksum.id,
              });
            }

            const data = Buffer.from(`${lines.join('\n')}\n`, 'utf8');
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.id,
              name: checksumAssetName,
              data,
              headers: {
                'content-type': 'text/plain',
                'content-length': data.length,
              },
            });

            console.log(`Uploaded ${checksumAssetName} for ${checksumTargets.length} assets`);

      - name: Fix draft release tag
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = context.ref.replace('refs/tags/', '');

            // 获取所有 release（包括 draft）
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            // 先尝试找正确 tag 的 release
            let release = releases.find(r => r.tag_name === tag);

            // 如果没找到，找最新的 draft release（可能是 untagged-xxx）
            if (!release) {
              release = releases.find(r => r.draft && r.tag_name.startsWith('untagged-'));
              if (release) {
                console.log(`Found untagged draft release: ${release.tag_name}, fixing to ${tag}`);
                await github.rest.repos.updateRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                  tag_name: tag,
                });
                console.log(`✅ Fixed tag_name to ${tag}`);
              } else {
                throw new Error(`No draft release found for tag ${tag}`);
              }
            }

      # 回归清单不进公开 release 描述，只写到本次运行的 Summary 页供维护者自查
      - name: Publish regression checklist to run summary
        run: cat .github/RELEASE_CHECKLIST.md >> "$GITHUB_STEP_SUMMARY"
